<!DOCTYPE html>

  <style>
    :root{
      --bg:#070b12; --bg2:#0c111b; --panel:rgba(0,0,0,.28);
      --border:rgba(255,255,255,.10); --border2:rgba(255,255,255,.16);

      --radius:12px; --shadow:0 8px 30px rgba(0,0,0,.45);
      --mono:"JetBrains Mono","Fira Code",ui-monospace,SFMono-Regular,Menlo,monospace;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      background:radial-gradient(1200px 800px at 50% -10%,var(--bg2),var(--bg)) fixed;
      color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;
    }
    .wrap{max-width:1180px;margin:0 auto;padding:18px 16px 64px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
    .brand{display:flex;align-items:baseline;gap:10px;font-weight:900;letter-spacing:.18em;font-size:20px;color:var(--accent)}
    .brand small{font-weight:600;letter-spacing:.08em;font-size:11px;color:var(--muted)}

    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
      padding:9px 13px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;

      text-decoration:none;transition:background .12s,border-color .12s,color .12s;white-space:nowrap;line-height:1}
    .btn:hover{background:rgba(255,255,255,.10)}
    .btnPrimary{border-color:rgba(73,234,203,.45);background:rgba(73,234,203,.12);color:var(--accent)}
    .btnPrimary:hover{background:var(--accent);color:#031014}
    .btnGhost{background:transparent;opacity:.9}
    .btnSm{padding:7px 10px;font-size:12px}
    .btnRec.recording{border-color:rgba(230,70,70,.6);background:rgba(230,70,70,.18);color:#ff8080;animation:recPulse 1s ease-in-out infinite}
    @keyframes recPulse{0%,100%{opacity:1}50%{opacity:.55}}
    .grid{display:grid;grid-template-columns:1.05fr .95fr;gap:14px;align-items:start}
    @media (max-width:940px){.grid{grid-template-columns:1fr}}
    .panel{border:1px solid var(--border);border-radius:var(--radius);
      background:var(--panel);backdrop-filter:blur(10px);box-shadow:var(--shadow);overflow:hidden}
    .panelHead{padding:11px 14px;border-bottom:1px solid var(--border);

    .chip{font-family:var(--mono);font-size:11px;color:var(--accent);

    .panelBody{padding:12px 14px}
    #stageWrap{position:relative;width:100%;aspect-ratio:1/1;border-radius:8px;overflow:hidden;
      background:#04070c;border:1px solid var(--border)}
    #stage{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
    #recOverlay{position:absolute;top:12px;right:14px;font-family:var(--mono);font-size:13px;
      font-weight:800;color:#ff7a7a;letter-spacing:.06em;display:none}
    #recOverlay.show{display:block}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

    .traitLbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
    select.sel{width:100%;background:var(--bg2);color:var(--text);border:1px solid var(--border2);
      border-radius:8px;padding:7px 8px;font-size:12px;font-family:var(--mono);cursor:pointer}
    .lockBtn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border2);background:rgba(255,255,255,.04);
      color:var(--muted);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
    .lockBtn.on{border-color:rgba(73,234,203,.5);background:rgba(73,234,203,.14);color:var(--accent)}
    .sect{border-top:1px solid var(--border);margin-top:10px;padding-top:10px}

    .recResult{display:none;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
    .recResult .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--accent)}

    kbd{font-family:var(--mono);font-size:10px;background:rgba(255,255,255,.07);border:1px solid var(--border2);
      border-radius:4px;padding:1px 5px}

<script>
(() => {
"use strict";

/* ═══════════════════ helpers ═══════════════════ */
const W=64, H=64;                           // coarse grid → big, bold pixels (8px each on the 512 canvas)
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function hash32(a,b,c){let x=(a|0)+((b|0)*374761393)+((c|0)*668265263);x=(x^(x>>>13))*1274126177;return (x^(x>>>16))>>>0;}
function mulberry(seed){let s=seed>>>0;return ()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;};}
const hx=h=>({r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16)});
const toHex=o=>'#'+[o.r,o.g,o.b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');
const dk=(h,f)=>{const c=hx(h);return toHex({r:c.r*f,g:c.g*f,b:c.b*f});};
const lt=(h,f)=>{const c=hx(h);return toHex({r:c.r+(255-c.r)*f,g:c.g+(255-c.g)*f,b:c.b+(255-c.b)*f});};

/* ═══════════════════ colour banks ═══════════════════ */
const PALETTES=[
  {name:'Neon',   bg1:'#2a1550', bg2:'#120826', accent:'#ff2d8e', outline:'#0a0612'},
  {name:'Cyber',  bg1:'#0a2838', bg2:'#04121b', accent:'#00e5ff', outline:'#03090e'},
  {name:'Toxic',  bg1:'#153a1b', bg2:'#07160b', accent:'#9dff3d', outline:'#050e06'},
  {name:'Vapor',  bg1:'#421a5c', bg2:'#141033', accent:'#26e0d0', outline:'#0a0714'},
  {name:'Blood',  bg1:'#45121a', bg2:'#180608', accent:'#ff3b30', outline:'#0d0405'},
  {name:'Gold',   bg1:'#332a12', bg2:'#141005', accent:'#ffc83a', outline:'#0c0a03'},
  {name:'Void',   bg1:'#182029', bg2:'#05080c', accent:'#7fe9ff', outline:'#02040a'},
  {name:'Kaspa',  bg1:'#0e3a44', bg2:'#04141a', accent:'#49EACB', outline:'#03100f'},
];
// human tones first (0..HUMAN_SKINS-1), then a short tail of intentional stylized skins
const SKINS=['#f2c7ab','#e9b48f','#d99a6c','#c88a5a','#b97a4e','#8a5636','#6b4a34','#caa07a',
             '#7fcbc4','#a7d18a','#b0b7c4','#c497e6','#93a0ff'];
const HUMAN_SKINS=8;
const HAIRS=['#20242c','#4a3524','#7a4a1e','#c9ccd4','#ff2d6f','#00e5ff','#9dff3d','#ffc83a','#b45cff','#ff6a3d','#12e39a','#f2f2f7'];
const IRISES=['#00e5ff','#ff2d8e','#9dff3d','#ffc83a','#7fe9ff','#ff5a5a','#b45cff','#12e39a','#4a3520'];

/* ═══════════════════ trait schema (DJ / sound themed) ═══════════════════ */
const LAYERS=[
  {key:'head',  label:'Head',    opts:['oval','square','tall','wide'], optional:false},
  {key:'ears',  label:'Ears',    opts:['normal','pointy','cyber','none'], optional:false},
  {key:'eyes',  label:'Eyes',    opts:['focused','sharp','wide','closed','cyclops','visor','scanner','x','star'], optional:false},
  {key:'brows', label:'Brows',   opts:['none','angry','raised','flat','uni'], optional:false},
  {key:'mouth', label:'Mouth',   opts:['smirk','frown','grin','shout','flat','fangs','gum','tongue'], optional:false},
  {key:'hair',  label:'Hair',    opts:['bald','buzz','mohawk','spiky','sidecut','topknot','afro','messy'], optional:false},
  {key:'gear',  label:'Cans',    opts:['none','cans','cap','beanie','bandana','crown','halo'], optional:true},
  {key:'acc',   label:'Face',    opts:['none','shades','mic','eyepatch','scar','warpaint','mask','cyberjaw','tattoo'], optional:true},
  {key:'ear1',  label:'Earring', opts:['none','stud','ring','bolt','hoop'], optional:true},
  {key:'hands', label:'Hands',   opts:['none','cue','rings-up','fist','peace'], optional:true},
  {key:'bust',  label:'Fit',     opts:['tee','hoodie','jacket','armor','bare'], optional:false},
  {key:'px',    label:'Pixel',   opts:['fine','mosaic','shards','blocks'], optional:false, weights:[8,3,2,2]},
];
const optOf=(key)=>{ const l=LAYERS.find(x=>x.key===key); return l.opts[params.v[key]||0]; };

/* ═══════════════════ state ═══════════════════ */
const DEF={seed:7777, pal:1, skin:0, hair:4, iris:0, coarse:8,
  v:{head:0,ears:0,eyes:0,brows:1,mouth:0,hair:2,gear:1,acc:0,ear1:0,hands:1,bust:2,px:0}};
const params=JSON.parse(JSON.stringify(DEF));
const locks={}; LAYERS.forEach(l=>locks[l.key]=false);
const lockCol={pal:false,skin:false,hair:false,iris:false};

/* ═══════════════════ pixel buffer ═══════════════════ */
let ch=new Array(W*H).fill(null);
const CXL=31, CXR=32;                       // centre columns (axis 31.5)
const inb=(x,y)=>x>=0&&x<W&&y>=0&&y<H;
const S=(x,y,c)=>{ if(inb(x,y)&&c) ch[y*W+x]=c; };
const M=(x,y,c)=>{ S(x,y,c); S(W-1-x,y,c); };
const RECT=(x,y,w,h,c)=>{ for(let j=0;j<h;j++)for(let i=0;i<w;i++)S(x+i,y+j,c); };
const HL=(x0,x1,y,c)=>{ for(let x=x0;x<=x1;x++)S(x,y,c); };
const VL=(x,y0,y1,c)=>{ for(let y=y0;y<=y1;y++)S(x,y,c); };
const DISC=(cx,cy,r,c)=>{ for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++) if(x*x+y*y<=r*r+r*0.4) S(cx+x,cy+y,c); };
const RING=(cx,cy,r,c)=>{ for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){const d=x*x+y*y; if(d<=r*r+r*0.4 && d>=(r-1)*(r-1)) S(cx+x,cy+y,c);} };

/* ── geometry (64 grid) ── */
const CROWN=10, CHIN=50, HMID=30;
const browY=26, eyeY=32, mouthY=44, earY=35, noseY0=34, noseY1=39;

function snoise1(x,seed){ const xi=Math.floor(x),xf=x-xi;
  const a=(hash32(seed,xi,0)%1000)/1000, b=(hash32(seed,xi+1,0)%1000)/1000;
  const s=xf*xf*(3-2*xf); return a+(b-a)*s; }
// seed-driven head shape — mirrored, gently lopsided
let HS={w:1,jaw:.34,chin:0,cheek:0,crown:1,wob:0,wseed:0,asym:0,aseed:0,cock:0};
function computeShape(seed){
  const r=mulberry(hash32(seed,55,7));
  HS={ w:0.84+r()*0.38, jaw:0.10+r()*0.68, chin:r()*0.72,
       cheek:(r()-0.40)*0.48, crown:0.86+r()*0.40, wob:r()*0.05, wseed:(r()*1e5)|0,
       asym:0.35+r()*0.7, aseed:(r()*1e5)|0,
       cock:(r()<0.55)?(r()<0.5?-1:1):0 };
}
function hwFor(shape,y){
  let maxW=(shape==='wide'?20:shape==='tall'?15:17)*HS.w;
  const ry=shape==='tall'?21:20;
  let t=clamp((y-HMID)/ry,-1,1), base;
  if(shape==='square') base=maxW*Math.pow(Math.max(0,1-Math.pow(Math.abs(t),4)),0.26);
  else base=maxW*Math.sqrt(Math.max(0,1-t*t));
  if(y<HMID) base=maxW*Math.pow(Math.max(0,1-t*t),0.40)*HS.crown;
  if(y>HMID){ const l=(y-HMID)/(CHIN-HMID); base*= 1 - HS.jaw*l*l - HS.chin*Math.pow(l,3); }
  base*= 1 + HS.cheek*Math.exp(-Math.pow((y-35)/6,2));
  base*= 1 + (snoise1(y*0.34,HS.wseed)-0.5)*2*HS.wob;
  return Math.max(3, Math.round(base));
}
function edgeOff(y,side){ return (snoise1(y*0.30, HS.aseed+(side<0?0:911))-0.5)*2*HS.asym; }
const edgeL=(shape,y)=>Math.max(3,Math.round(hwFor(shape,y)+edgeOff(y,-1)));
const edgeR=(shape,y)=>Math.max(3,Math.round(hwFor(shape,y)+edgeOff(y, 1)));

// per-render geometry: named anchors + skull edges → every feature tracks the skull
function computeGeom(shape){
  const hwEye=(edgeL(shape,eyeY)+edgeR(shape,eyeY))/2;
  const eyeDX=Math.round(clamp(hwEye*0.42,6,11));
  return {
    shape, crownY:CROWN, chinY:CHIN, browY, eyeY, mouthY, earY, noseY0, noseY1,
    exL:32-eyeDX, exR:31+eyeDX, eyeDX,
    edgeL:(y)=>edgeL(shape,y), edgeR:(y)=>edgeR(shape,y),
    xl:(y)=>32-edgeL(shape,y), xr:(y)=>31+edgeR(shape,y),
  };
}

/* ═══════════════════ colours per render ═══════════════════ */
function colors(){
  const P=PALETTES[params.pal], sk=SKINS[params.skin], hr=HAIRS[params.hair], ir=IRISES[params.iris];
  return {
    bg1:P.bg1,bg2:P.bg2,accent:P.accent,outline:P.outline,
    skin:sk, skinHi:lt(sk,.16), skinSh:dk(sk,.82), skinDk:dk(sk,.64),
    hair:hr, hairHi:lt(hr,.30), hairSh:dk(hr,.56),
    brow:dk(hr,.60), iris:ir, irisHi:lt(ir,.55), irisSh:dk(ir,.5),
    white:'#eef2f7', dark:'#0d0f16', lip:dk(sk,.5), teeth:'#f4f2ee',
    metal:'#aab2bd', metalHi:'#dbe1e7', metalSh:'#5c636e'
  };
}

/* ═══════════════════ layer painters ═══════════════════ */
function drawBust(C,G,name){
  const y0=51, base={tee:C.accent,hoodie:dk(C.hair,.85),jacket:'#2b303c',armor:C.metal,bare:C.skin}[name]||C.accent;
  const hi=lt(base,.18), sh=dk(base,.62), swf=y=>Math.min(27,Math.round(12+Math.sqrt(Math.max(0,y-y0))*6));
  for(let y=y0;y<H;y++){ const w=swf(y); RECT(32-w,y,2*w,1,base); S(32-w,y,sh);S(31+w,y,sh); }
  HL(32-15,31+15,y0,hi);
  RECT(28,46,8,6,C.skin); VL(28,46,50,C.skinSh); RECT(34,46,2,6,C.skinDk); HL(28,35,46,C.skinSh);
  RECT(27,50,10,1,C.skinDk);
  if(name==='tee'){ for(let i=0;i<5;i++){S(29+i,51+i,sh);S(34-i,51+i,sh);} HL(20,43,52,hi);
    for(let i=0;i<5;i++){ const bx=25+i*3, bh=1+((i*7)%3); RECT(bx,58-bh,2,bh,IRISES[params.iris]); } }  // little EQ cluster
  else if(name==='hoodie'){ RECT(25,50,14,3,dk(base,.82)); RECT(23,52,4,H-52,base);RECT(37,52,4,H-52,base);
    VL(31,53,H-1,sh);VL(32,53,H-1,sh); S(30,55,'#dcdce2');S(30,56,'#dcdce2');S(33,57,'#dcdce2'); }
  else if(name==='jacket'){ for(let i=0;i<7;i++){S(31-i,51+i,dk(base,.5));S(32+i,51+i,dk(base,.5));}
    VL(31,52,H-1,sh);VL(32,52,H-1,sh); for(let y=54;y<H;y+=2)S(31,y,C.metalHi); RECT(24,52,3,3,dk(base,.5));RECT(37,52,3,3,dk(base,.5)); }
  else if(name==='armor'){ DISC(22,55,4,C.metalHi);DISC(41,55,4,C.metalHi); RECT(24,51,16,2,C.metalSh);
    for(let x=27;x<37;x+=3)VL(x,54,H-1,C.metalSh); M(24,58,C.accent); HL(28,35,52,C.metalHi); }
  else if(name==='bare'){ HL(24,39,52,C.skinSh); S(27,54,C.skinDk);S(36,54,C.skinDk); RECT(30,52,4,1,C.skinDk);
    S(23,53,C.accent);S(24,54,C.accent); }
}

function drawHead(C,G){
  for(let y=G.crownY;y<G.chinY;y++){ const xl=G.xl(y),xr=G.xr(y);
    HL(xl,xr,y,C.skin);
    S(xr,y,C.skinSh); S(xr-1,y,dk(C.skin,.9)); S(xl,y,dk(C.skin,.94));
    if(y>40) HL(xl,xr,y,dk(C.skin,.9)); }
  for(let y=G.crownY+2;y<24;y++){ const xl=G.xl(y); HL(xl+2,CXL+1,y,C.skinHi); }
  RECT(20,26,7,4,lt(C.skin,.08));
  RECT(CXR+3,34,6,8,C.skinSh); S(CXR+8,40,C.skinDk);
  for(let yy=45;yy<48;yy++){ const xl=G.xl(yy),xr=G.xr(yy); if(xr-xl>8) HL(xl+3,xr-3,yy,dk(C.skin,.9)); }  // chin plane
  VL(CXL,G.noseY0,G.noseY1,lt(C.skin,.10)); VL(CXR,G.noseY0,G.noseY1,C.skinSh);
  RECT(28,39,2,2,C.skinSh); RECT(34,39,2,2,C.skinDk); S(31,40,C.skinSh);S(32,40,C.skinDk);
  RECT(G.exL-5,G.eyeY-4,10,3,C.skinSh); RECT(G.exR-4,G.eyeY-4,10,3,C.skinSh);
}

function drawEars(C,G,name){
  if(name==='none')return; const y=G.earY;

// ── hands near the head: DJ gestures, rings render as bright colour clusters ──
function drawHands(C,G,name){
  if(name==='none')return; const sk=C.skin, sh=C.skinSh, hi=C.skinHi;
  const ir=IRISES[params.iris], r1=C.accent, r2=lt(ir,.10), r3=lt(C.accent,.4);
  if(name==='cue'){                                       // hand cupped over the left headphone
    const bx=G.xl(G.earY)-3, by=G.earY-1;
    RECT(bx-1,by,4,5,sk); RECT(bx-1,by,4,1,hi); HL(bx-1,bx+2,by+4,sh);
    for(let f=0;f<4;f++)VL(bx-1+f,by-3,by,sk);            // fingers up onto the cup
    S(bx,by-1,r1); S(bx+2,by-2,r2);                       // ring cluster
    return; }
  if(name==='rings-up'){                                  // raised hand beside the head, fingers up + rings
    const x=G.xl(G.eyeY)-4, y=G.eyeY;
    RECT(x-1,y+2,5,4,sk); RECT(x-1,y+2,5,1,hi);
    for(let f=0;f<4;f++)VL(x-1+f,y-4,y+2,sk);
    S(x-1,y-1,r1);S(x-1,y,r1); S(x+1,y-1,r2);S(x+1,y,r2); S(x+3,y-2,r3);   // bold ring clusters
    return; }
  if(name==='fist'){                                      // fist near the chin/jaw
    const x=G.xl(G.mouthY)-3, y=G.mouthY-1;
    RECT(x-1,y,6,5,sk); RECT(x-1,y,6,1,hi); HL(x-1,x+4,y+4,sh);

    const x=G.xl(G.eyeY)-4, y=G.eyeY;

    VL(x,y-4,y+2,sk); VL(x+2,y-4,y+2,sk);                 // V fingers
    S(x,y-1,r1);S(x,y,r1); S(x+2,y,r2);

/* ── outline (dark silhouette border) ── */
function outlinePass(outline){
  const add=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){ if(ch[y*W+x]!==null)continue;
    if((x>0&&ch[y*W+x-1])||(x<W-1&&ch[y*W+x+1])||(y>0&&ch[(y-1)*W+x])||(y<H-1&&ch[(y+1)*W+x])) add.push(y*W+x); }
  add.forEach(i=>ch[i]=outline);
}

/* ═══════════════════ build ═══════════════════ */
function build(blink){
  ch.fill(null);
  const C=colors();
  params.hairShape=optOf('head');
  params.style=optOf('px');
  computeShape(params.seed);
  const G=computeGeom(params.hairShape);
  drawBust(C,G,optOf('bust'));
  drawHead(C,G);
  drawEars(C,G,optOf('ears'));
  drawEyes(C,G,optOf('eyes'),blink);
  drawBrows(C,G,optOf('brows'));
  drawMouth(C,G,optOf('mouth'));
  drawAcc(C,G,optOf('acc'));
  drawHair(C,G,optOf('hair'));
  drawGear(C,G,optOf('gear'));
  drawEar1(C,G,optOf('ear1'));
  drawHands(C,G,optOf('hands'));
  outlinePass(C.outline);
  return C;
}

    cc.closePath();cc.fill(); };
  const halfPx=(gx,gy,sz,rot,col)=>{ if(!col)return; const x=mx+gx*SC,y=my+gy*SC,s=sz*SC,h=s/2; cc.fillStyle=col;
    if(rot%2===0) cc.fillRect(x, rot===0?y:y+h, s, h); else cc.fillRect(rot===1?x+h:x, y, h, s); };
  const quarterPx=(gx,gy,sz,rot,col)=>{ if(!col)return; const x=mx+gx*SC,y=my+gy*SC,s=sz*SC,h=s/2; cc.fillStyle=col;
    const ox=(rot===1||rot===2)?h:0, oy=(rot>=2)?h:0; cc.fillRect(x+ox,y+oy,h,h); };
  const uni=(gx,gy,sz)=>{ const c0=cell(gx,gy); for(let j=0;j<sz;j++)for(let i=0;i<sz;i++)if(cell(gx+i,gy+j)!==c0)return 0; return c0===null?2:1; };
  const maj=(gx,gy,sz)=>{ const n={};let b=null,bn=0; for(let j=0;j<sz;j++)for(let i=0;i<sz;i++){const c=cell(gx+i,gy+j);if(!c)continue;n[c]=(n[c]||0)+1;if(n[c]>bn){bn=n[c];b=c;}} return b; };
  const minor=(gx,gy,sz,base)=>{ const n={};let b=null,bn=0; for(let j=0;j<sz;j++)for(let i=0;i<sz;i++){const c=cell(gx+i,gy+j);if(!c||c===base)continue;n[c]=(n[c]||0)+1;if(n[c]>bn){bn=n[c];b=c;}} return b; };
  function tile(gx,gy,sz){
    const u=uni(gx,gy,sz);
    if(u===2)return; if(u===1){rectPx(gx,gy,sz,cell(gx,gy));return;}
    const small=(style==='blocks')?sz<=4:sz<=2;
    if(small){
      const base=maj(gx,gy,sz), second=minor(gx,gy,sz,base);
      rectPx(gx,gy,sz,base);
      if(second){ const rnd=hash32(sd,gx,gy), rot=rnd&3;
        if(style==='shards'){ triPx(gx,gy,sz,rot,second); }
        else if(style==='blocks'){ const k=rnd%3; if(k===0)halfPx(gx,gy,sz,rot,second); else if(k===1)quarterPx(gx,gy,sz,rot,second); else triPx(gx,gy,sz,rot,second); }
        else { const k=rnd%4; if(k===0)triPx(gx,gy,sz,rot,second); else if(k===1)halfPx(gx,gy,sz,rot,second); else if(k===2)quarterPx(gx,gy,sz,rot,second); else triPx(gx,gy,sz,(rnd>>2)&3,second); }
      }
      return;
    }
    const h=sz>>1; tile(gx,gy,h);tile(gx+h,gy,h);tile(gx,gy+h,h);tile(gx+h,gy+h,h);
  }
  const ST=params.coarse||8;
  for(let gy=0;gy<H;gy+=ST)for(let gx=0;gx<W;gx+=ST)tile(gx,gy,ST);
}
function paint(bobY){
  const C=lastC;
  const g=ctx.createLinearGradient(0,0,0,canvas.height); g.addColorStop(0,lt(C.bg1,.06)); g.addColorStop(1,C.bg2);
  ctx.fillStyle=g; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.imageSmoothingEnabled=false;
  const SC=8, dw=W*SC, m=(canvas.width-dw)/2, my=m+Math.round(bobY*SC);
  if(params.style==='mosaic'||params.style==='shards'||params.style==='blocks'){ drawStyled(ctx,SC,m,my); return; }
  const img=octx.createImageData(W,H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){ let col=ch[y*W+x];
    if(col===null){ const t=y/H, r=Math.hypot(x-32,y-30)/40; col=lerpHex(lt(C.bg1,0.05*(1-r)),C.bg2,clamp(t*1.05,0,1)); }
    const c=hx(col), i=(y*W+x)*4; img.data[i]=c.r;img.data[i+1]=c.g;img.data[i+2]=c.b;img.data[i+3]=255; }
  octx.putImageData(img,0,0);
  ctx.drawImage(off,m,my,dw,dw);
}
function frame(now){
  requestAnimationFrame(frame);
  const t=now||0, cyc=(t/1000)%4.4, blink=cyc>4.2, bob=Math.sin(t/950)*0.6;
  lastC=build(blink); paint(bob);
}
requestAnimationFrame(frame);

/* ═══════════════════ controls ═══════════════════ */
const traitHost=document.getElementById('traitHost'), sels={};
LAYERS.forEach(l=>{
  const row=document.createElement('div'); row.className='trait';
  row.innerHTML='<span class="traitLbl">'+l.label+'</span>';
  const sel=document.createElement('select'); sel.className='sel';
  l.opts.forEach((o,i)=>{ const op=document.createElement('option'); op.value=i; op.textContent=o; sel.appendChild(op); });
  sel.value=params.v[l.key];
  sel.addEventListener('change',()=>{ params.v[l.key]=+sel.value; });
  const lock=document.createElement('button'); lock.className='lockBtn'; lock.textContent='🔓'; lock.title='lock';
  lock.addEventListener('click',()=>{ locks[l.key]=!locks[l.key]; lock.classList.toggle('on',locks[l.key]); lock.textContent=locks[l.key]?'🔒':'🔓'; });
  row.appendChild(sel); row.appendChild(lock); traitHost.appendChild(row); sels[l.key]=sel;
});
const palRow=document.getElementById('palRow');
PALETTES.forEach((p,i)=>{ const s=document.createElement('div'); s.className='pal'+(i===params.pal?' active':'');
  s.title=p.name; s.style.background='linear-gradient(135deg,'+p.accent+' 0%,'+p.bg1+' 55%,'+p.bg2+' 100%)';
  s.addEventListener('click',()=>{ params.pal=i; [...palRow.children].forEach((x,xi)=>x.classList.toggle('active',xi===i)); });
  palRow.appendChild(s); });
const colorHost=document.getElementById('colorHost');
function swatchStrip(label,list,cur,onPick){
  const wrap=document.createElement('div'); wrap.style.marginBottom='8px';
  wrap.innerHTML='<div class="traitLbl" style="margin-bottom:4px">'+label+'</div>';
  const row=document.createElement('div'); row.className='swatchRow';
  list.forEach((c,i)=>{ const s=document.createElement('div'); s.className='pal'+(i===cur()?' active':''); s.style.background=c;
    s.addEventListener('click',()=>{ onPick(i); [...row.children].forEach((x,xi)=>x.classList.toggle('active',xi===cur())); }); row.appendChild(s); });
  wrap.appendChild(row); colorHost.appendChild(wrap); return row;
}
const skinRow=swatchStrip('Skin',SKINS,()=>params.skin,i=>params.skin=i);
const hairRow=swatchStrip('Hair',HAIRS,()=>params.hair,i=>params.hair=i);
const irisRow=swatchStrip('Eyes',IRISES,()=>params.iris,i=>params.iris=i);

// mosaic coarseness slider (affects mosaic / shards / blocks pixel styles)
const coarseSect=document.createElement('div'); coarseSect.className='sect';
coarseSect.innerHTML='<div class="sectHd">Mosaic coarseness</div>';
const coarseRow=document.createElement('div'); coarseRow.className='trait'; coarseRow.style.gridTemplateColumns='1fr 54px';
const coarseInput=document.createElement('input'); coarseInput.type='range'; coarseInput.min='2'; coarseInput.max='4'; coarseInput.step='1';
coarseInput.value=String(Math.round(Math.log2(params.coarse)));
const coarseVal=document.createElement('span'); coarseVal.className='ctrlVal'; coarseVal.style.fontFamily='var(--mono)'; coarseVal.style.fontSize='11px'; coarseVal.style.color='var(--accent)'; coarseVal.textContent=params.coarse+'px';
coarseInput.addEventListener('input',()=>{ params.coarse=1<<(+coarseInput.value); coarseVal.textContent=params.coarse+'px'; });
coarseRow.appendChild(coarseInput); coarseRow.appendChild(coarseVal); coarseSect.appendChild(coarseRow);
colorHost.parentElement.parentElement.appendChild(coarseSect);

function syncUI(){
  LAYERS.forEach(l=>sels[l.key].value=params.v[l.key]);
  [...palRow.children].forEach((x,xi)=>x.classList.toggle('active',xi===params.pal));
  [...skinRow.children].forEach((x,xi)=>x.classList.toggle('active',xi===params.skin));
  [...hairRow.children].forEach((x,xi)=>x.classList.toggle('active',xi===params.hair));
  [...irisRow.children].forEach((x,xi)=>x.classList.toggle('active',xi===params.iris));
  coarseInput.value=String(Math.round(Math.log2(params.coarse))); coarseVal.textContent=params.coarse+'px';
  document.getElementById('seedChip').textContent='seed '+params.seed;
}

/* ═══════════════════ variation ═══════════════════ */
const NONE_BIAS=0.36;
function pick(rng,l){ if(l.optional && rng()<NONE_BIAS) return 0;
  if(l.weights){ const tot=l.weights.reduce((a,b)=>a+b,0); let r=rng()*tot; for(let i=0;i<l.weights.length;i++){ if((r-=l.weights[i])<0) return i; } return 0; }
  return Math.floor(rng()*l.opts.length); }
function pickSkin(rng){ return rng()<0.72 ? Math.floor(rng()*HUMAN_SKINS) : HUMAN_SKINS+Math.floor(rng()*(SKINS.length-HUMAN_SKINS)); }
function fromSeed(){
  const rng=mulberry(hash32(params.seed,1,1));
  LAYERS.forEach(l=>{ if(!locks[l.key]) params.v[l.key]=pick(rng,l); });
  if(!lockCol.pal)  params.pal =Math.floor(rng()*PALETTES.length);
  if(!lockCol.skin) params.skin=pickSkin(rng);
  if(!lockCol.hair) params.hair=Math.floor(rng()*HAIRS.length);
  if(!lockCol.iris) params.iris=Math.floor(rng()*IRISES.length);
  const lum=h=>{const c=hx(h);return .299*c.r+.587*c.g+.114*c.b;};
  if(!lockCol.hair && Math.abs(lum(SKINS[params.skin])-lum(HAIRS[params.hair]))<40) params.hair=(params.hair+5)%HAIRS.length;
  syncUI();
}
function randomize(){ params.seed=Math.floor(Math.random()*100000); fromSeed(); }
function mutate(){
  const rng=mulberry((Math.random()*1e9)|0);
  const acts=[()=>{const l=LAYERS[Math.floor(rng()*LAYERS.length)];if(!locks[l.key])params.v[l.key]=pick(rng,l);},
              ()=>{if(!lockCol.pal)params.pal=Math.floor(rng()*PALETTES.length);},
              ()=>{if(!lockCol.hair)params.hair=Math.floor(rng()*HAIRS.length);},
              ()=>{if(!lockCol.iris)params.iris=Math.floor(rng()*IRISES.length);}];
  const n=1+Math.floor(rng()*2); for(let i=0;i<n;i++)acts[Math.floor(rng()*acts.length)](); syncUI();
}
document.getElementById('btnRand').addEventListener('click',randomize);
document.getElementById('btnSeed').addEventListener('click',()=>{ params.seed=Math.floor(Math.random()*100000); fromSeed(); });
document.getElementById('btnMutate').addEventListener('click',mutate);
document.getElementById('btnReset').addEventListener('click',()=>{ Object.assign(params,JSON.parse(JSON.stringify(DEF))); syncUI(); });
window.addEventListener('keydown',e=>{ if(e.target.tagName==='SELECT')return; if(e.key==='r'||e.key==='R'){params.seed=Math.floor(Math.random()*100000);fromSeed();} });

/* ═══════════════════ export / share / publish ═══════════════════ */
const SHARE_URL='https://pixel-on-kaspa.fyi/head-lab.html';
const SHARE_TXT='Pixel DJ with attitude, generated in Pixies on Pixel on Kaspa. Make your own:';
function exportPNG(scale){
  const margin=5, total=(W+2*margin)*scale, m=margin*scale;
  const cv=document.createElement('canvas'); cv.width=total; cv.height=total; const c=cv.getContext('2d');
  build(false); const C=colors();
  const g=c.createLinearGradient(0,0,0,total); g.addColorStop(0,lt(C.bg1,.06)); g.addColorStop(1,C.bg2);
  c.fillStyle=g; c.fillRect(0,0,total,total); c.imageSmoothingEnabled=false;
  if(params.style==='mosaic'||params.style==='shards'||params.style==='blocks'){ drawStyled(c,scale,m,m); return cv; }
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){ let col=ch[y*W+x]; if(col===null)continue;
    c.fillStyle=col; c.fillRect(m+x*scale,m+y*scale,scale,scale); }
  return cv;
}
function snapshotDataURL(){ return exportPNG(12).toDataURL('image/png'); }
document.getElementById('btnShot').addEventListener('click',()=>{ const a=document.createElement('a'); a.href=snapshotDataURL(); a.download='pixel-dj-'+params.seed+'.png'; a.click(); });
if(window.PixelShare){ PixelShare.mount({ buttonId:'btnShareX', getDataURL:snapshotDataURL, text:SHARE_TXT, url:SHARE_URL, hashtags:['pixelart','nft','dj'], filenamePrefix:'pixel-dj' }); }
function captureState(){ return {v:3, seed:params.seed, pal:params.pal, skin:params.skin, hair:params.hair, iris:params.iris, coarse:params.coarse, traits:{...params.v}}; }
function restoreState(p){ if(!p)return;
  if(p.seed!=null)params.seed=p.seed|0; ['pal','skin','hair','iris'].forEach(k=>{ if(p[k]!=null)params[k]=p[k]|0; });
  if(p.coarse!=null)params.coarse=clamp(1<<Math.round(Math.log2(p.coarse|0||8)),4,16);
  if(p.traits)LAYERS.forEach(l=>{ if(p.traits[l.key]!=null)params.v[l.key]=clamp(p.traits[l.key]|0,0,l.opts.length-1); }); syncUI(); }
if(window.PixelGallery){ PixelGallery.registerLab({ id:'head-lab', name:'Pixies', labUrl:'/head-lab.html', title:'Pixel DJ', publishButtonId:'btnPublish', captureState, restoreState, renderThumbnail:()=>snapshotDataURL() }); }

/* ═══════════════════ REC ═══════════════════ */
const REC_MS=6000; let recording=false, lastBlob=null, lastExt='mp4';
const btnRec=document.getElementById('btnRec'), recOverlay=document.getElementById('recOverlay');
const recResult=document.getElementById('recResult'), recPlayer=document.getElementById('recPlayer');
btnRec.addEventListener('click',()=>{
  if(recording)return; recording=true; btnRec.classList.add('recording'); btnRec.textContent='● REC';
  const stream=canvas.captureStream(30), chunks=[];
  const FMT=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm'];
  let rec; for(const m of FMT){ if(MediaRecorder.isTypeSupported(m)){ try{rec=new MediaRecorder(stream,{mimeType:m,videoBitsPerSecond:8_000_000});break;}catch(e){} } }
  if(!rec) rec=new MediaRecorder(stream);
  const mime=rec.mimeType||'video/webm'; lastExt=mime.includes('mp4')?'mp4':'webm';
  rec.ondataavailable=e=>{ if(e.data.size)chunks.push(e.data); };
  rec.onstop=()=>{ lastBlob=new Blob(chunks,{type:mime}); recPlayer.src=URL.createObjectURL(lastBlob); recResult.style.display='flex';
    recording=false; btnRec.classList.remove('recording'); btnRec.textContent='REC 6s'; recOverlay.classList.remove('show'); };
  rec.start(100);
  const t0=performance.now();
  (function tick(){ const left=Math.ceil((REC_MS-(performance.now()-t0))/1000);
    if(performance.now()-t0>=REC_MS){ rec.stop(); return; }
    recOverlay.classList.add('show'); recOverlay.textContent='● REC '+Math.max(0,left); requestAnimationFrame(tick); })();
});
document.getElementById('recSave').addEventListener('click',()=>{ if(!lastBlob)return; const a=document.createElement('a'); a.href=URL.createObjectURL(lastBlob); a.download='pixel-dj-'+params.seed+'.'+lastExt; a.click(); });

/* boot — optional ?seed= deep-link */
(()=>{ const q=new URLSearchParams(location.search); const sd=q.get('seed');
  if(sd!=null && sd!=='' && !isNaN(+sd)){ params.seed=(+sd)|0; fromSeed(); } })();
syncUI();
})();
</script>
